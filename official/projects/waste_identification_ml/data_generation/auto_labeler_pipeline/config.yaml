# ============================================================================
# Pipeline configuration.
#
# This file is safe to edit by hand. Every value below is a knob you are
# expected to change between runs or between datasets. If you make a mistake
# (a typo, a missing field, a value out of range), the pipeline stops
# immediately at startup with a message telling you exactly what is wrong and
# how to fix it -- it will NOT fail partway through a long GPU run.
#
# What you may NOT do from this file: invent new augmentation names, new crop
# variants, or new prompt behaviours. Those are fixed in code. This file only
# selects and tunes among the options the code already supports.
# ============================================================================

# ----------------------------------------------------------------------------
# Paths and hardware.
# ----------------------------------------------------------------------------

# Parent directory containing one subfolder per dataset. No trailing slash.
root_dir: "/home/umairsabir/test_set/milk_packet/2026-06-23"

# Absolute path to the SAM3 model checkpoint.
sam3_checkpoint_path: "/home/umairsabir/sam3_original_weight/sam3.pt"

# GPU device index made visible to the process (sets CUDA_VISIBLE_DEVICES).
cuda_visible_devices: "0"

# ----------------------------------------------------------------------------
# Which object class this run is labelling.
#
# This MUST be one of the keys under `prompts:` below. It selects, in one
# place, the detection thresholds AND the augmentation set for the whole run.
# ----------------------------------------------------------------------------
prompt_to_detect: "packets"

# ----------------------------------------------------------------------------
# Stage-level run knobs.
# ----------------------------------------------------------------------------

# split_train_val.py: keep every Nth image (1 keeps all, 3 keeps 0,3,6,...).
keep_every_nth: 6

# split_train_val.py: fraction assigned to the train split.
# NOTE: the current pipeline uses 0.10, which puts 10% in train and 90% in
# val. This is preserved deliberately. Change it only if you intend to.
train_ratio: 0.10

# filter_sparse_images.py: images with fewer than this many post-filter
# detections are moved out to the sibling `<root_dir>_empty` directory.
min_detections: 2

# segment_to_classifier.py: which crop variants to write.
# Allowed values: raw, black_background, imagenet_mean_background.
# One variant -> flat layout under each class
# folder; multiple variants -> one subdirectory per variant.
crop_variants: ["imagenet_mean_background"]

# ----------------------------------------------------------------------------
# Per-prompt behaviour.
#
# Each block bundles everything that depends on the object class:
#   detection:     SAM3 thresholds and sizing for this class.
#   augmentations: which train-split augmentations to apply for this class.
#
# `prompt_to_detect` above chooses which block is active. Augmentation names
# and their meanings are fixed in code; you may only choose which of the
# supported ones to enable here.
# ----------------------------------------------------------------------------
prompts:
  "bottles and containers":
    detection:
      confidence_threshold: 0.5
      score_threshold: 0.20
      containment_threshold: 0.98
      max_short_side: 1024
      crop_size: [256, 256]
    augmentations:
    - vflip
    - hflip
    - rot45
    - rot65
    - rot90
    - blur

  "packets":
    detection:
      confidence_threshold: 0.3
      score_threshold: 0.0
      containment_threshold: 0.98
      max_short_side: 1024
      crop_size: [256, 256]
    augmentations:
    - vflip
    - hflip
    - rot45
    - rot65
    - rot90
    - blur
    - noise03
    - noise06
    - cjitter
